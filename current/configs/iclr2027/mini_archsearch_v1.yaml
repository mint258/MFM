architecture:
  type: shared_multitask
  preset: shared_light
  task_route: light
  task_route_per_task:
    energy: light
    charge: light
    element: light
    geometry: light
    bond: light
    descriptor: light

backbone:
  n_atom_types: 95
  dim: 196
  layers: 4
  heads: 4
  ff_mult: 2
  dropout: 0.0
  use_dist_bias: true
  use_radius_mask: false
  radius: 8.0

expert:
  real_layers: 1
  internal_layers: 0
  heads: 4
  ff_mult: 2
  dropout: 0.0
  activation_checkpointing: true

head:
  bond_negative_ratio: 1.0

supervision:
  variant: SPD

loss:
  energy: 1.0
  charge: 1.0
  element: 1.0
  bond_existence: 0.2
  bond_order: 0.2
  distance: 1.0
  angle: 0.0
  torsion: 0.0
  graph_descriptor: 0.20
  charge_descriptor: 0.25
  element_descriptor: 0.25
  cutoff: 2.0
  morse_a: 0.6
  element_label_smoothing: 0.1
  element_temperature: 1.5
  element_entropy_reg: 0.05
  element_logit_l2: 0.0001

schedule:
  candidate: delayed
  name: delayed_v1
  descriptor_start_fraction_of_pass: 0.10
  descriptor_ramp_fraction_of_pass: 0.03
  stage1_decay_fraction_of_pass: 0.03
  stage1_floor: 0.3

optimizer:
  name: AdamW
  lr: 7.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  grad_clip_norm: 1.0
  min_lr_ratio: 0.05

training:
  model_scale: mini_archsearch_v1
  max_passes: 3
  batch_size: 96
  atom_budget_per_batch: 12288
  filter_max_atoms: 196
  num_workers: 6
  precision: bf16
  seed: 0
  warmup_fraction: 0.05
  validation_points_per_pass: 8
  max_val_batches: 32

perturbation:
  assignment: sha256_stable_sample_identity_v3
  recipes:
    - [clean, 0.0, 0.625]
    - [geom, 0.2, 0.125]
    - [geom, 0.3, 0.0625]
    - [topo, 0.3, 0.125]
    - [both, 0.1, 0.0625]

convergence_gate:
  validation_window: 4
  total_relative_improvement_max: 0.03
  major_relative_improvement_max: 0.05
  minimum_passes: 1
  max_passes: 3
