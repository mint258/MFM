name: Complete previously uncollected core regression
on:
  push:
    branches: [integration/model-data-expansion-20261104]
permissions:
  contents: read
jobs:
  core-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      WANDB_MODE: offline
      WANDB_SILENT: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      MERGE_VALIDATION_OUTPUT: /tmp/mfm-core-validation
      MERGE_RESUME_CORE: "1"
      MERGED_TREE: 23362976994413e349c7e0e261dc3ddac079e2a2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install complete CPU dependencies
        run: |
          mkdir -p /tmp/mfm-core-validation
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt periodictable
          python -m pip install numpy==2.2.6 scipy==1.15.3 wandb==0.28.1 rdkit==2025.9.5 duckdb==1.5.6
          python -m pip freeze > /tmp/mfm-core-validation/environment.txt
      - name: Bind shipped references
        run: |
          echo "PHASE1_NATIVE_TRANSPORT_PATH=$GITHUB_WORKSPACE/reproduction/linked_sources/docs/phase1/evidence/stage48_full_corpus_qa/native_qa_stats_v3.py" >> "$GITHUB_ENV"
          echo "PHASE1_FORMAL_PROTOCOL_PATH=$GITHUB_WORKSPACE/reproduction/linked_sources/docs/phase1/evidence/stage59_three_epoch_protocol_v1/actual_scientific_freeze_v1/phase1_three_epoch_scientific_protocol.json" >> "$GITHUB_ENV"
          echo "MODEL_V3_D5_PROJECTION_SOURCE=$GITHUB_WORKSPACE/workflows/data_v1_final/export/wire_v1/sampling_projection_v1.py" >> "$GITHUB_ENV"
          echo "TMPDIR=/tmp" >> "$GITHUB_ENV"
      - name: Execute core tests that previously stopped before collection
        run: python .github/merge_validation.py
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previously-uncollected-core-regression
          path: |
            /tmp/mfm-core-validation/*.json
            /tmp/mfm-core-validation/*.log
            /tmp/mfm-core-validation/*.xml
            /tmp/mfm-core-validation/environment.txt
          retention-days: 14
