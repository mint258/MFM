name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check_repository.py
      - name: Future consumer lifecycle unit tests
        run: python -m unittest workflows.benchmark_evaluation.test_consumer_lifecycle -v
